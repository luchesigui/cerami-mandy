services:
  postgres:
    image: public.ecr.aws/supabase/postgres:17.6.1.106
    entrypoint: /entrypoint.sh
    env_file:
      - apps/backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts/postgres-entrypoint.sh:/entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
